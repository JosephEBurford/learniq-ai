ce((n,a)=>n+a.due.length,0)}</strong><span class="delta">Next 7 days · Sample</span></div><div class="hub-metric"><small>Active associates</small><strong>${sampleTeam.length}</strong><span class="delta">3 departments</span></div></div><div class="hub-layout"><div class="hub-stack"><section class="hub-section" id="priority-panel"><div class="flex between"><div><div class="eyebrow">AI PRIORITY INBOX</div><h2>What needs your attention</h2></div><span class="mini-pill">Explainable recommendations</span></div>${alerts||'<div class="notice">All recommendations reviewed. You can still explore team insights.</div>'}<div class="ai-disclosure">Insights are rule-based demonstrations derived from fictional course and progress data; no employee decisions are automated.</div></section><section class="hub-section"><div class="flex between"><div><h2>Associate learning pulse</h2><p>Track completion, overdue items, and new assignments.</p></div>${btn('View all associates',"go('team')",'outline')}</div><div style="overflow-x:auto"><table class="hub-table"><thead><tr><th>ASSOCIATE</th><th>PROGRESS</th><th>STATUS</th><th>ASSIGNMENTS</th><th></th></tr></thead><tbody>${sampleTeam.map(associateRow).join('')}</tbody></table></div></section></div><div class="hub-stack"><section class="hub-section"><div class="eyebrow">AI WORKFORCE INSIGHTS</div><h2>Where to focus</h2><div class="insight-list"><div class="insight-row"><strong>Customer experience readiness · 64%</strong><p>Suggested coaching focus for Front End associates.</p>${progress(64)}<div style="margin-top:12px">${btn('Assign Customer First',`recommendCourse('Customer First')`,'secondary')}</div></div><div class="insight-row"><strong>Safety readiness · 88%</strong><p>Strong overall. One associate has an overdue safety module.</p>${progress(88)}</div><div class="insight-row"><strong>Leadership readiness · 41%</strong><p>Opportunity to develop team leads through targeted learning.</p>${progress(41)}</div></div></section><section class="hub-section"><div class="eyebrow">QUICK ACTIONS</div><h2>Move work forward</h2><div class="list">${btn('Assign training',"go('assign')")}${btn('Explore skill insights',"go('insights')",'secondary')}${btn('Preview associate app',"toggleDevice()",'outline')}</div></section></div></div>`}
function managerTeam(){let chosen=sampleTeam.find(a=>a.id===(state.selectedAssociate||'jordan'))||sampleTeam[0];let coursesOutstanding=outstanding(chosen);let newAssigned=state.extraAssignments[chosen.id]||[];return `<div class="eyebrow">STORE 1842 · TEAM LEARNING</div><h1>Associate progress</h1><p>Explore individual readiness, training requirements, and suggested coaching opportunities.</p><div class="hub-layout"><section class="hub-section"><h2>Team directory</h2><div style="overflow-x:auto"><table class="hub-table"><thead><tr><th>ASSOCIATE</th><th>PROGRESS</th><th>STATUS</th><th>NEW</th><th></th></tr></thead><tbody>${sampleTeam.map(associateRow).join('')}</tbody></table></div></section><section class="hub-section"><div class="eyebrow">ASSOCIATE PROFILE</div><h2>${chosen.name}</h2><p>${chosen.role} · ${chosen.department}</p><div class="stat">${teamPct(chosen)}%</div>${progress(teamPct(chosen))}<h3>Training attention</h3>${coursesOutstanding.length?coursesOutstanding.map(x=>`<div class="m-minirow"><span>${x}</span><span class="mini-pill urgent">Overdue</span></div>`).join(''):'<p class="muted">No overdue modules.</p>'}${chosen.due.map(x=>`<div class="m-minirow"><span>${x}</span><span class="mini-pill">Due soon</span></div>`).join('')}${newAssigned.map(x=>`<div class="m-minirow"><span>${x}</span><span class="mini-pill good">Assigned</span></div>`).join('')}<div class="m-ai-pulse"><div class="eyebrow">✧ AI RECOMMENDATION</div><p>${coursesOutstanding.length?'Prioritize the overdue training before adding optional development work.':'Consider targeted development aligned with this associate’s role.'}</p>${btn('Assign recommended training',`state.selectedAssociate='${chosen.id}';recommendCourse('${coursesOutstanding[0]||'Team Communication'}')`)}</div></section></div>`}
function managerAssignment(){let selected=state.selectedAssociate||'jordan';return `<div class="eyebrow">STORE MANAGER · ACTION CENTER</div><h1>Assign learning</h1><p>Send a targeted course to an associate. Jordan's assignments are connected to the mobile experience.</p><div class="hub-layout"><section class="hub-section"><h2>New training assignment</h2><label class="muted">Associate</label><select id="targetassociate" class="choice">${sampleTeam.map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${a.name} · ${a.department}</option>`).join('')}</select><label class="muted">Training course</label><select id="assigncourse" class="choice">${courses.map(c=>`<option ${c.id===(state.recommendedCourse||'Customer First')?'selected':''}>${c.id}</option>`).join('')}</select><p class="muted">Assignment will be recorded in this demo. Jordan's training will appear on the associate mobile dashboard.</p>${btn('Assign training',"managerAssignSelected()")}</section><section class="hub-section"><div class="eyebrow">✧ AI GUIDANCE</div><h2>Suggested assignment</h2><p>Customer First is recommended for Front End associates with outstanding service training. Check workload and due dates before assigning additional modules.</p><div class="notice">Human review required. LearnIQ does not automatically assign training based on an AI recommendation.</div></section></div>`}

div class="eyebrow">✧ AI COACH</div><h2>Practice before your next shift</h2><p>Try a customer conversation, clarify a procedure, or explore your career path.</p>${btn('Practice with AI',"go('coach')")}<div class="m-minirow"><span>Career pathway</span><button class="hub-btn-link" onclick="go('career')">Explore →</button></div><div class="m-minirow"><span>Scenario simulator</span><button class="hub-btn-link" onclick="go('scenario')">Try it →</button></div></section></div>`};
const previousMobileShell=mobileShell;mobileShell=function(){let html=previousMobileShell();if(mobileTab==='home'){let todo=state.assigned.filter(x=>!state.completed.includes(x));let panel=`<div class="m-ai-pulse"><div class="m-overline">✧ AI DAILY BRIEFING</div><h3>${todo.length?'Your next best step':'Your learning is on track'}</h3><p>${todo.length?`Focus on ${esc(todo[0])} next. Your manager can see your completion once you finish.`:'You have completed your assigned courses. Want to build your next skill?'}</p><div class="m-alertline"><b>◷</b><span>${todo.length} assigned course${todo.length===1?'':'s'} remaining</span></div><div class="m-alertline"><b>✧</b><span>Personalized practice available in AI Coach</span></div>${btn('Ask LearnIQ Coach',"mobileGo('coach')")}</div>`;html=html.replace('<div class="m-section">',panel+'<div class="m-section">')}return html};
const previousMobileComplete=mobileComplete;mobileComplete=function(){let before=state.completed.length;previousMobileComplete();if(state.completed.length>before){state.activity.unshift('Jordan completed '+active);save()}};

const desktopRender=render;render=function(){document.body.classList.toggle('mobile-mode',deviceMode==='mobile');el('deviceSwitch').textContent=deviceMode==='mobile'?'▣ Desktop view':'◧ Mobile preview';if(deviceMode==='mobile'){el('role').value='associate';el('pageName').textContent='Associate mobile';el('view').innerHTML=mobileShell()}else desktopRender()};render();

// Build 04A: contextual, rule-driven multi-turn assistant; no external AI API.
let cpHistory={manager:[],associate:[],admin:[]},cpPending=null,cpOpen=false,cpLastTopic={manager:'',associate:'',admin:''};
function cpRole(){return deviceMode==='mobile'?'associate':role}
function cpInit(){document.body.insertAdjacentHTML('beforeend',`<button class="cp-launch" id="cp-launch" onclick="cpToggle()">✧ Ask LearnIQ Copilot</button><section class="cp-panel" id="cp-panel" role="dialog" aria-label="LearnIQ Copilot" aria-modal="false"><div class="cp-head"><div><strong>✧ LearnIQ Copilot</strong><small id="cp-role">Context-aware learning assistant</small></div><button onclick="cpToggle()" aria-label="Close Copilot">✕</button></div><div class="cp-context" id="cp-context"></div><div class="cp-log" id="cp-log" aria-live="polite"></div><div class="cp-suggestions" id="cp-suggestions"></div><div id="cp-proposal"></div><form class="cp-compose" onsubmit="cpSubmit(event)"><input id="cp-input" placeholder="Ask about training, progress, or next steps…" aria-label="Message Copilot" maxlength="400"/><button type="submit">Send</button></form><div class="cp-note">Live AI via secure server endpoint · Fictional training records · Manager approval required for assignments.</div></section>`);cpRefresh()}
function cpToggle(){cpOpen=!cpOpen;el('cp-panel').classList.toggle('open',cpOpen);if(cpOpen){cpRefresh();el('cp-input').focus()}}
function cpRefresh(){if(!el('cp-panel'))return;let r=cpRole();el('cp-role').textContent=({manager:'Store Manager · Store 1842',associate:'Associate · Jordan Lee',admin:'Learning Administrator'})[r];el('cp-context').textContent=r==='manager'?`Team context · ${sampleTeam.length} associates · ${allOverdue()} overdue · ${teamAvg()}% average completion`:r==='associate'?`Your learning · ${pct()}% complete · ${state.assigned.filter(x=>!state.completed.includes(x)).length} open assignments`:'Learning content · '+courses.length+' available courses';let h=cpHistory[r];el('cp-log').innerHTML=(h.length?h:[{who:'ai',text:r==='manager'?'I can review your team, explain overdue training, or prepare a training plan for your approval. What would you like to do?':r==='associate'?'I can explain a lesson, practice a customer scenario, or help prioritize your assignments. What are you working on?':'I can help plan learning content and review course coverage. What would you like to explore?'}]).map(m=>`<div class="cp-msg ${m.who==='user'?'user':''}"><small>${m.who==='user'?'You':'LearnIQ Copilot'}</small>${cpEscape(m.text)}</div>`).join('');el('cp-log').scrollTop=el('cp-log').scrollHeight;let suggestions=r==='manager'?['Who is overdue?','Show Jordan’s progress','Create a recovery plan','Why is completion low?']:r==='associate'?['What should I learn next?','Explain customer service','Practice a customer scenario','How is my progress?']:['What courses are available?','Suggest a course outline','How is training progressing?'];el('cp-suggestions').innerHTML=suggestions.map(q=>`<button onclick="cpAsk('${q.replace(/'/g,"\\'")}')">${cpEscape(q)}</button>`).join('');cpRenderProposal()}
function cpEscape(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cpSubmit(e){e.preventDefault();let input=el('cp-input'),q=input.value.trim();if(!q)return;input.value='';cpAsk(q)}
function cpAsk(q){let r=cpRole(),s=q.toLowerCase();cpHistory[r].push({who:'user',text:q});let answer='';cpPending=null;
if(r==='manager'){
 let person=sampleTeam.find(a=>s.includes(a.name.split(' ')[0].toLowerCase()));
 if(person){cpLastTopic[r]=person.id;answer=`${person.name} · ${person.department}\nLearning completion: ${teamPct(person)}%. Overdue: ${outstanding(person).join(', ')||'none'}. Due soon: ${person.due.join(', ')||'none'}.\nI can prepare a training assignment for your review.`;}
 else if(/overdue|late|attention|priority|urgent/.test(s)){answer=`${allOverdue()} overdue training item(s) need attention:\n${sampleTeam.map(a=>`${a.name}: ${outstanding(a).join(', ')||'no overdue courses'}`).join('\n')}\nI recommend resolving required training before assigning optional development.`;}
 else if(/plan|assign|recommend|action|follow.up/.test(s)){let target=sampleTeam.find(a=>a.id===cpLastTopic[r])||sampleTeam.find(a=>outstanding(a).length)||sampleTeam[0];let course=outstanding(target)[0]||'Customer First';cpPending={id:target.id,course};answer=`I drafted a training action for ${target.name}: assign “${course}.” Review the associate and course below before confirming. No changes have been made.`;}
 else if(/why|declin|completion|insight|gap|progress|status|team/.test(s)){answer=`Store 1842 learning completion averages ${teamAvg()}% across ${sampleTeam.length} sample associates. ${allOverdue()} overdue item(s) remain. Customer experience readiness is illustrated at 64%. These figures describe the demo data; they do not establish a real-world cause. Review overdue assignments and shift capacity before making decisions.`;}
 else answer=`I can analyze training status, identify overdue courses, and prepare manager-approved assignments. Try “Who is overdue?” or “Create a recovery plan.”`;
}else if(r==='associate'){
 let todo=state.assigned.filter(x=>!state.completed.includes(x));
 if(/next|priority|assign|overdue|what should|start/.test(s)){answer=todo.length?`Your next assigned course is “${todo[0]}.” You have ${todo.length} outstanding assignment(s). Start with required learning, then ask me to explain any confusing concepts.`:'You have completed your assigned training. Consider Team Communication or explore a career pathway.';}
 else if(/progress|complete|done|status/.test(s)){answer=`You've completed ${state.completed.length} of ${courses.length} courses (${pct()}%). Completed: ${state.completed.join(', ')||'none yet'}. Your manager can see updated completion after you finish a lesson.`;}
 else if(/scenario|practice|customer|upset|service/.test(s)){answer='Let’s practice: A customer is frustrated because an item was marked available but is not on the shelf. First acknowledge their frustration, then verify inventory and offer a practical next step. Try: “I understand that’s frustrating. Let me check availability and help find an option.” You can open Scenario Practice from the learning menu.';}
 else if(/safety|hazard/.test(s)){answer='For a potential store hazard, prioritize immediate safety, follow your location’s established procedures, and alert an appropriate supervisor. Your required Safety Basics training contains the relevant steps. I cannot replace official safety guidance.';}
 else if(/career|grow|lead/.test(s)){answer='A Team Lead pathway can build communication, customer service, and operational skills. Consider Team Communication after finishing required courses. You can explore Career Pathways in the app.';}
 else answer='I can explain customer-service concepts, suggest your next course, practice a scenario, or review your progress. Which would help most?';
}else{answer=/course|outline|create|author/.test(s)?'Suggested outline: objective, short explanation, scenario, knowledge check, and review. An administrator should verify accuracy and approve content before publishing.':'The learning library contains '+courses.length+' sample courses. You can review course coverage and authoring tools in the administrator workspace.';}
 cpHistory[r].push({who:'ai',text:answer});cpRefresh()}
function cpRenderProposal(){let host=el('cp-proposal');if(!host)return;if(!cpPending||cpRole()!=='manager'){host.innerHTML='';return}host.innerHTML=`<div class="cp-proposal"><strong>Review suggested assignment</strong><label for="cp-target">Associate</label><select id="cp-target">${sampleTeam.map(a=>`<option value="${a.id}" ${a.id===cpPending.id?'selected':''}>${cpEscape(a.name)} · ${cpEscape(a.department)}</option>`).join('')}</select><label for="cp-course">Course</label><select id="cp-course">${courses.map(c=>`<option value="${cpEscape(c.id)}" ${c.id===cpPending.course?'selected':''}>${cpEscape(c.id)}</option>`).join('')}</select><button class="cp-action" onclick="cpApprove()">Approve and assign training</button><button style="border:0;background:transparent;color:#0053a4;padding:10px;cursor:pointer" onclick="cpPending=null;cpRenderProposal()">Cancel</button></div>`}
function cpApprove(){let id=el('cp-target').value,course=el('cp-course').value;cpPending=null;assignTo(id,course);cpHistory.manager.push({who:'ai',text:`Assignment confirmed: ${course} assigned to ${sampleTeam.find(a=>a.id===id).name}. Switch to the associate mobile preview to see Jordan’s assignment when Jordan is selected.`});cpRefresh()}
const cpOriginalRender=render;render=function(){cpOriginalRender();cpRefresh()};cpInit();

/* Build 04B: live AI, server-side key, role-scoped demo context, explicit approval. */
let aiBusy=false;
function aiContext(r){
  const common={courses:courses.map(c=>({id:c.id,description:c.desc,skill:c.skill})),demo:true};
  if(r==='manager')return {...common,store:'Store 1842',team:sampleTeam.map(a=>({id:a.id,name:a.name,department:a.department,role:a.role,completionPercent:teamPct(a),overdue:outstanding(a),dueSoon:a.due,assigned:state.extraAssignments[a.id]||[]})),teamAverage:teamAvg(),overdueCount:allOverdue(),recentActivity:state.activity.slice(0,6)};
  if(r==='associate')return {...common,associate:{name:'Jordan Lee',completed:state.completed,assigned:state.assigned,progressPercent:pct(),outstanding:state.assigned.filter(x=>!state.completed.includes(x))}};
  return {...common,availableCourses:courses.length};
}
async function aiRequest(role,question,history){
  const response=await fetch('/api/copilot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role,question,history,context:aiContext(role)})});
  let data={};try{data=await response.json()}catch{}
  if(!response.ok)throw new Error(data.error||'Unable to reach AI. Please try again.');
  if(!data.answer)throw new Error('AI returned no answer. Please retry.');
  return data;
}
function aiSetBusy(b){aiBusy=b;let input=el('cp-input');if(input)input.disabled=b;let sendBtn=document.querySelector('#cp-panel .cp-compose button');if(sendBtn){sendBtn.disabled=b;sendBtn.textContent=b?'Thinking…':'Send';}}
cpAsk=async function(q){
  if(aiBusy)return;
  const r=cpRole(),history=cpHistory[r].slice(-10).map(m=>({role:m.who==='user'?'user':'assistant',content:m.text}));
  cpHistory[r].push({who:'user',text:q});cpPending=null;cpRefresh();aiSetBusy(true);
  cpHistory[r].push({who:'ai',text:'Thinking…'});cpRefresh();
  try{
    const result=await aiRequest(r,q,history);
    cpHistory[r][cpHistory[r].length-1]={who:'ai',text:result.answer};
    if(r==='manager'&&result.proposal&&sampleTeam.some(a=>a.id===result.proposal.id)&&courses.some(c=>c.id===result.proposal.course))cpPending=result.proposal;
  }catch(e){cpHistory[r][cpHistory[r].length-1]={who:'ai',text:'AI unavailable: '+e.message};}
  finally{aiSetBusy(false);cpRefresh();}
};
async function aiAssociateAsk(q){
  if(aiBusy)return;
  const history=state.messages.slice(-10).map(m=>({role:m.from==='user'?'user':'assistant',content:m.text}));
  state.messages.push({from:'user',text:q});state.messages.push({from:'ai',text:'Thinking…'});save();render();aiSetBusy(true);
  try{const result=await aiRequest('associate',q,history);state.messages[state.messages.length-1].text=result.answer;}
  catch(e){state.messages[state.messages.length-1].text='AI unavailable: '+e.message;}
  finally{aiSetBusy(false);save();render();}
}
send=function(){let input=el('prompt');const q=input?.value.trim();if(q)aiAssociateAsk(q)};
mobileAsk=function(q){if(q)aiAssociateAsk(q)};
mobileSend=function(){const q=el('mobilePrompt')?.value.trim();if(q)aiAssociateAsk(q)};
</script></body></html>
